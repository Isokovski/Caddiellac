<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golf-Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f7d3a">
<meta name="apple-mobile-web-app-title" content="Golf-Tracker">
<style>
:root{--bg:#f4f6f1;--card:#fff;--tx:#1b1f1a;--mu:#6a7068;--bd:#dfe3da;--ac:#2f7d3a;--pr:#2f9e44;--bi:#1c7ed6;--bo:#f2c230;--db:#f08c00;--tr:#e03131;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141713;--card:#1f241e;--tx:#eef1ea;--mu:#9aa196;--bd:#32392f;--ac:#5cc16b;--pr:#47b35a;--bi:#5aa9ff;--bo:#e8b923;--db:#f59f1a;--tr:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141713;--card:#1f241e;--tx:#eef1ea;--mu:#9aa196;--bd:#32392f;--ac:#5cc16b;--pr:#47b35a;--bi:#5aa9ff;--bo:#e8b923;--db:#f59f1a;--tr:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px 100px}
main{max-width:560px;margin:0 auto;padding-top:12px}
h1{font-size:21px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.del{background:transparent;color:var(--tr);padding:4px 8px;font-weight:400}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.hole{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.hole:first-of-type{border-top:0}
.hn{flex:1;min-width:0}.hn small{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 7px;color:var(--mu);font-size:11px}.hn small b{font-size:13px;font-weight:600;color:var(--tx)}
.st{display:flex;align-items:center;gap:10px;flex:none}
.st button{position:relative;width:33px;height:33px;border-radius:9px;padding:0;font-size:0;line-height:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.st button::before,.st button::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--tx);border-radius:1px}
.st button::before{width:13px;height:2px}
.st button::after{width:2px;height:13px}
.st button:first-child::after{display:none}
.v{min-width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;background:var(--c)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 0 8px;border-top:1px solid var(--bd)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mu)}
.sc{display:grid;gap:4px;margin-top:6px}
.sc .c{border-radius:8px;text-align:center;padding:6px 0;color:#fff;background:var(--c);font-weight:700}
.sc small{display:block;font-weight:400;font-size:10px;opacity:.9}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;background:var(--c)}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.li:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 0;font-weight:600}
nav button.on{color:var(--ac)}
.pars{display:flex;flex-wrap:wrap;gap:6px}.pars select{width:64px;padding:8px}
.hide{display:none}
.card>label:first-child,.row>div>label:first-child{margin-top:0}
.ib{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;min-width:15px;padding:0;margin:0 0 0 4px;border-radius:50%;border:1px solid var(--mu);background:transparent;color:var(--mu);font:italic 700 10px/1 Georgia,serif;vertical-align:middle}
.hh .ib{width:12px;height:12px;min-width:12px;margin-left:2px;font-size:9px;vertical-align:baseline;position:relative;top:1px}
.pc .phb{color:var(--ac);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pc .phb img{width:100%;height:100%;object-fit:cover;display:block}
.lk{color:var(--ac);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.dp{margin:0 0 8px;padding:2px 10px 8px;background:var(--bg);border-radius:10px}
.he{gap:5px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.top h1{margin:0}
.pf{width:38px;height:38px;border-radius:50%;padding:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.5px}
.chv{height:42px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-weight:700;font-size:18px;color:var(--ac)}
.tb{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.tb th{font-size:11px;color:var(--mu);font-weight:600;padding:0}
.tb td{text-align:center;padding:0}
.tb td.d{text-align:left;white-space:nowrap;padding-right:4px}
.tb .s{display:block;min-width:24px;padding:5px 0;border-radius:6px;color:#fff;background:var(--c);font-weight:700}
.tb td.t{white-space:nowrap;padding:0 2px;line-height:1.15}
.tb td.t small{display:block;font-size:10px;color:var(--mu)}
.pc{width:38px;flex:none;text-align:center}
.pc button{width:38px;height:40px;padding:0;font-size:14px;font-weight:700;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.pc button.e{display:block;position:relative;margin:0 auto;width:22px;height:22px;border-radius:50%;border:0;background:var(--mu);color:var(--card);font-size:0;line-height:0}
.pc button.e::before,.pc button.e::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border-radius:1px}
.pc button.e::before{width:12px;height:2px}
.pc button.e::after{width:2px;height:12px}
.hole.hp{cursor:pointer}
.hole.hh{padding:0 0 2px;font-size:11px;color:var(--mu);border-top:0}
.row>.dt{flex:0 0 64px}
.ic{position:relative;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.ic input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
#pk.ov{overscroll-behavior:contain;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{overscroll-behavior:contain;width:100%;max-width:560px;background:var(--card);border-radius:16px 16px 0 0;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.ph b{font-size:15px}.ph span{font-size:22px;font-weight:700;color:var(--ac)}
.wl{display:flex;gap:8px;font-size:11px;color:var(--mu);text-align:center}.wl div{flex:1}
.wheels{display:flex;gap:8px;position:relative}
.wheels::after{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-top:1px solid var(--ac);border-bottom:1px solid var(--ac);border-radius:8px;pointer-events:none;background:rgba(47,158,68,.1)}
.wheel{flex:1;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:80px}
.wheel .it{height:40px;line-height:40px;text-align:center;font-size:22px;color:var(--mu);scroll-snap-align:center;cursor:pointer}
.wheel .it.sel{color:var(--tx);font-weight:700}
</style>
</head>
<body>
<main>
<div class="top"><h1>⛳ Golf-Tracker</h1><button id="pf" class="pf" aria-label="Persönliche Einstellungen" onclick="openProf()"></button></div>
<div id="v"></div>
</main>
<div id="pk" class="hide"></div>
<nav id="nav"><button data-t="r">Runde</button><button data-t="s">Statistik</button><button data-t="p">Plätze</button></nav>
<script>
var S={courses:[{id:"c1",name:"Golf Resort Pankow",pars:[3,3,3,3,3,3]},{id:"c2",name:"Golfanlage Groß Kienitz",pars:[3,5,5]}],rounds:[]};
var T="r",cur=null,draft=null,fc=null,edit=null,dbRef=null,KEY="golf-tracker-v1";
var $=function(i){return document.getElementById(i)};
function uid(){return Math.random().toString(36).slice(2,9)}
function C(id){return S.courses.filter(function(c){return c.id===id})[0]}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fd(s){var p=s.split("-");return p[2]+"."+p[1]+"."+p[0]}
function fs(s){var p=s.split("-");return p[2]+"."+p[1]+"."+p[0].slice(2)}
function fh(v){return v<0?"−"+(-v):v>0?"+"+v:"0"}
function fdm(s){var p=s.split("-");return p[2]+"."+p[1]+"."}
function rtab(c,list,par,full){return '<div style="overflow-x:auto"><table class="tb"><tr><th></th>'+c.pars.map(function(p,i){return '<th>'+(i+1)+'</th>'}).join("")+'<th>Ges.</th><th></th></tr>'+list.map(function(r){var t=r.strokes.reduce(function(a,b){return a+b},0);return '<tr><td class="d">'+(full?fs(r.date):fdm(r.date))+'</td>'+r.strokes.map(function(s,i){return '<td><span class="s" role="button" style="cursor:pointer;--c:'+col(s-c.pars[i])+'" onclick="holeStats('+i+')">'+s+'</span></td>'}).join("")+'<td class="t"><b>'+t+'</b><small>'+sg(t-par)+'</small></td><td style="white-space:nowrap"><button class="del" onclick="editRound(\''+r.id+'\')" aria-label="Runde bearbeiten">✎</button><button class="del" onclick="delRound(\''+r.id+'\')" aria-label="Runde löschen">✕</button></td></tr>'}).join("")+'</table></div>'}
var AO=false;
function rsFor(c){return S.rounds.filter(function(r){return r.course===c.id}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function lchart(vals,rs,W,par,nh){
  var n=vals.length,H=150,pl=32,pr=10,pt=12,pb=20,mn=nh,mx=Math.max.apply(null,vals.concat([par]));
  if(mx<=mn)mx=mn+1;
  function X(i){return n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto;margin-bottom:10px">',mid=Math.round((mx+mn)/2),tk=[mx,mn];
  if(mid!==mx&&mid!==mn&&mid!==par)tk.push(mid);
  tk.forEach(function(v){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="'+(pl-5)+'" y="'+(Y(v)+4)+'" font-size="10" text-anchor="end" fill="var(--mu)">'+v+'</text>'});
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(par)+'" y2="'+Y(par)+'" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(Y(par)-4)+'" font-size="10" text-anchor="end" fill="var(--mu)">Par '+par+'</text>';
  s+='<polyline fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" points="'+vals.map(function(v,i){return X(i)+","+Y(v)}).join(" ")+'"/>';
  vals.forEach(function(v,i){s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" fill="var(--ac)"/>'});
  s+='<text x="'+(n===1?X(0):pl)+'" y="'+(H-4)+'" font-size="10" fill="var(--mu)" text-anchor="'+(n===1?"middle":"start")+'">'+fs(rs[0].date)+'</text>';
  if(n>1)s+='<text x="'+(W-pr)+'" y="'+(H-4)+'" font-size="10" fill="var(--mu)" text-anchor="end">'+fs(rs[n-1].date)+'</text>';
  return s+'</svg>'}
function drawAll(){
  var c=C(fc);if(!c)return;
  var rs=rsFor(c),par=c.pars.reduce(function(a,b){return a+b},0),pk=$("pk"),W=Math.max(240,Math.min(560,window.innerWidth)-28);
  var vals=rs.map(function(r){return r.strokes.reduce(function(a,b){return a+b},0)});
  pk.innerHTML='<div class="sheet" style="max-height:88vh;overflow-y:auto"><div class="ph"><b>Alle Runden · '+c.name+'</b><button class="sec" style="padding:4px 12px" onclick="closePick()" aria-label="Schließen">✕</button></div>'+(rs.length?'<div class="mu" style="margin-bottom:4px">Verlauf (Schläge gesamt)</div>'+lchart(vals,rs,W,par,c.pars.length)+rtab(c,rs.slice().reverse(),par,true):'<div class="mu">Keine Runden.</div>')+'</div>';
  pk.className="ov";
}
function openAll(){AO=true;drawAll()}
var PK="golf-tracker-photos-v1",LP={},AS=null,PH=0;
try{LP=JSON.parse(localStorage.getItem(PK)||"{}")||{}}catch(e){LP={}}
var CAM='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function purl(id){if(!id)return null;if(String(id).indexOf("l_")===0)return LP[id]||null;return null}
function pcell(i){var u=purl(arr(edit,"photos")[i]);return '<div class="pc"><button class="phb" onclick="openPhoto('+i+')" aria-label="Foto Loch '+(i+1)+'">'+(u?'<img alt="" src="'+u+'">':CAM)+'</button></div>'}
function openPhoto(i){PH=i;drawPhoto(i)}
function phIn(){$("phin").click()}
function phMsg(t){var m=$("phm");if(m)m.textContent=t}
function rmPhoto(i){arr(edit,"photos")[i]=null;arr(edit,"tee")[i]=null;arr(edit,"grn")[i]=null;arr(edit,"geo")[i]=null;drawPhoto(i);render()}
function drawPhoto(i){var u=purl(arr(edit,"photos")[i]),pk=$("pk");pk.innerHTML='<div class="sheet" style="max-height:88vh;overflow-y:auto"><div class="ph"><b>Loch '+(i+1)+' · Foto</b><button class="sec" style="padding:4px 12px" onclick="closePick()" aria-label="Schließen">✕</button></div>'+(u?'<img alt="Foto Loch '+(i+1)+'" src="'+u+'" onclick="fsOpen(this.src,'+i+',1)" style="cursor:zoom-in;display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:10px;margin-bottom:10px;background:var(--bg)">':'<div class="mu" style="margin-bottom:10px">Noch kein Foto vorhanden.</div>')+'<div id="phm" class="mu" style="margin-bottom:8px"></div><input id="phin" type="file" accept="image/*" class="hide" onchange="pickPhoto(this)"><div class="row"><button onclick="phIn()">'+(u?"Foto ersetzen":"Foto hinzufügen")+'</button>'+(u?'<button class="sec" onclick="rmPhoto('+i+')">Entfernen</button>':'')+'</div></div>';pk.className="ov"}
function shrink(f,max,q){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(function(b){b?res(b):rej()},"image/jpeg",q)};im.src=fr.result};fr.readAsDataURL(f)})}
function pickPhoto(el){var f=el.files&&el.files[0],i=PH;if(!f)return;el.value="";phMsg("Foto wird verarbeitet …");
  shrink(f,AS?1280:900,AS?0.8:0.7).then(function(b){
    if(AS)return AS.upload(b).then(function(r){return r.id});
    return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var id="l_"+uid();LP[id]=fr.result;try{localStorage.setItem(PK,JSON.stringify(LP))}catch(e){delete LP[id];id=null}res(id)};fr.onerror=function(){res(null)};fr.readAsDataURL(b)})
  }).then(function(id){if(!id)throw 0;if(!edit)return;arr(edit,"photos")[i]=id;arr(edit,"tee")[i]=null;arr(edit,"grn")[i]=null;arr(edit,"geo")[i]=null;drawPhoto(i);render()}).catch(function(){phMsg("Das Foto konnte nicht gespeichert werden.")})}
var FS=null;
var CLUBS=[["D","Driver"],["H3","Holz 3"],["H5","Holz 5"],["3E","3er Eisen"],["4E","4er Eisen"],["5E","5er Eisen"],["6E","6er Eisen"],["7E","7er Eisen"],["8E","8er Eisen"],["9E","9er Eisen"],["PW","Pitching Wedge"],["GW","Gap Wedge"],["SW","Sand Wedge"],["LW","Lob Wedge"],["P","Putter"]];
var FSROW="display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch";
function clubName(k){for(var j=0;j<CLUBS.length;j++)if(CLUBS[j][0]===k)return CLUBS[j][1];return k}
function exitFs(){var e=$("fs");if(FS&&FS.lp)clearTimeout(FS.lp.t);if(e)e.remove();FS=null}
function fsTot(){var s=FS,dt=dd(s.hi),te=Math.max(1,dt.t||0);return Math.max(te,draft.strokes[s.hi]-(dt.p||0))}
function fsIds(){var ids=[-1],n,k;if(!FS.ce){n=fsTot();for(k=0;k<n;k++)ids.push(k)}else ids.push(-2);return ids}
function fsGet(id){var s=FS,c;if(s.ce)return (id===-2?arr(edit,"grn"):arr(edit,"tee"))[s.hi]||null;var dt=dd(s.hi);if(id===-1){c=C(cur);return dt.tee===false?null:(dt.tee||(c&&c.tee&&c.tee[s.hi])||null)}return dt.pos[id]||null}
function fsSet(id,p){var s=FS;if(s.ce){(id===-2?arr(edit,"grn"):arr(edit,"tee"))[s.hi]=p;return}var dt=dd(s.hi);if(id===-1)dt.tee=p;else dt.pos[id]=p}
function fsFit(){var s=FS,a=s.area,nw=s.im.naturalWidth,nh=s.im.naturalHeight;if(!nw||!nh)return null;var W=a.clientWidth,H=a.clientHeight,k=Math.min(W/nw,H/nh);return{W:W,H:H,bw:nw*k,bh:nh*k}}
function fsLay(){var s=FS;if(!s||!s.area)return;var f=fsFit();if(!f)return;var z=s.z,w=f.bw*z,h=f.bh*z,l=f.W/2-s.cx*w,t=f.H/2-s.cy*h;l=w<=f.W?(f.W-w)/2:Math.max(f.W-w,Math.min(0,l));t=h<=f.H?(f.H-h)/2:Math.max(f.H-h,Math.min(0,t));s.cx=(f.W/2-l)/w;s.cy=(f.H/2-t)/h;s.w.style.left=l+"px";s.w.style.top=t+"px";s.w.style.width=w+"px";s.w.style.height=h+"px";s.pw=w;s.ph=h;fsMarks()}
function fsZoom(nz,ax,ay){var s=FS,f=s&&fsFit();if(!s||!f||!s.pw)return;nz=Math.max(1,Math.min(8,nz));var l=parseFloat(s.w.style.left)||0,t=parseFloat(s.w.style.top)||0,u=(ax-l)/s.pw,v=(ay-t)/s.ph,w2=f.bw*nz,h2=f.bh*nz;s.z=nz;s.cx=(f.W/2-(ax-u*w2))/w2;s.cy=(f.H/2-(ay-v*h2))/h2;fsLay()}
function fsPan(dx,dy){var s=FS;if(!s||!s.pw)return;s.cx-=dx/s.pw;s.cy-=dy/s.ph;fsLay()}
function fsZ(m){var s=FS;if(!s)return;fsZoom(s.z*m,s.area.clientWidth/2,s.area.clientHeight/2)}
function fsZB(){var b='style="padding:8px 14px;font-size:18px;line-height:1;flex:none" onclick="event.stopPropagation();fsZ(';return '<button class="sec" '+b+'1/1.6)" aria-label="Verkleinern">\u2212</button><button class="sec" '+b+'1.6)" aria-label="Vergr\u00f6\u00dfern">+</button>'}
